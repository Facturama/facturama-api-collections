info:
  name: Cfdis filtrados por Rfc
  type: http
  seq: 5

http:
  method: GET
  url: "{{SERVER}}/cfdi?type=Issued&status=Active&rfc=XAXX010101000"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  params:
    - name: type
      value: Issued
      type: query
    - name: status
      value: Active
      type: query
    - name: rfc
      value: XAXX010101000
      type: query
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
