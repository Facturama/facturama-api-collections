info:
  name: Detalle de Cfdi
  type: http
  seq: 1

http:
  method: GET
  url: "{{SERVER}}/Cfdi/_l0qPog2qSpryRUq1qfCrg2?type=issued"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  params:
    - name: type
      value: issued
      type: query
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Obtiene el detalle del CFDI con el Id y tipo seleccionado
