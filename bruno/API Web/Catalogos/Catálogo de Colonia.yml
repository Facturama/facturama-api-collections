info:
  name: Catálogo de Colonia
  type: http
  seq: 7

http:
  method: GET
  url: "{{SERVER}}/catalogs/neighborhoods?postalCode=71255"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  params:
    - name: postalCode
      value: "71255"
      type: query
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Listado de paises válidos
