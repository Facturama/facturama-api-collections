info:
  name: Catálogo de Municipios
  type: http
  seq: 5

http:
  method: GET
  url: "{{SERVER}}/catalogs/Municipalities?stateCode=SLP"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  params:
    - name: stateCode
      value: SLP
      type: query
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Listado de paises válidos
