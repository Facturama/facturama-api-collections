info:
  name: Catálogo de bancos
  type: http
  seq: 13

http:
  method: GET
  url: "{{SERVER}}/catalogs/banks"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
