info:
  name: Códigos postales
  type: http
  seq: 1

http:
  method: GET
  url: "{{SERVER}}/catalogs/PostalCodes?keyword=20001"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  params:
    - name: keyword
      value: "20001"
      type: query
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Obtener  los códigos postales
