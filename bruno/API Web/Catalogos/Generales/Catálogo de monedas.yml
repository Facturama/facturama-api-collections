info:
  name: Catálogo de monedas
  type: http
  seq: 6

http:
  method: GET
  url: "{{SERVER}}/catalogs/currencies?keyword=mexicano"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  params:
    - name: keyword
      value: mexicano
      type: query
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
