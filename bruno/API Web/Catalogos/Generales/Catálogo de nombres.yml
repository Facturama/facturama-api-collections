info:
  name: Catálogo de nombres
  type: http
  seq: 2

http:
  method: GET
  url: "{{SERVER}}/catalogs/NameIds"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Catalogo de los nombres que pueden establecer en el PDF
