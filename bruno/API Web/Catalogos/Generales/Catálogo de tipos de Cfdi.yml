info:
  name: Catálogo de tipos de Cfdi
  type: http
  seq: 5

http:
  method: GET
  url: "{{SERVER}}/Catalogs/CfdiTypes"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Muestra los tipos de factura que se pueden crear con la cuenta actual
