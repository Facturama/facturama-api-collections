info:
  name: Códigos de productos o servicios
  type: http
  seq: 6

http:
  method: GET
  url: "{{SERVER}}/catalogs/ProductsOrServices?keyword=desarrollo"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  params:
    - name: keyword
      value: desarrollo
      type: query
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Obtener los códigos de productos y servicios
