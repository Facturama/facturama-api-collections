info:
  name: incoterm
  type: http
  seq: 20

http:
  method: GET
  url: "{{SERVER}}/catalogs/incoterm"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

