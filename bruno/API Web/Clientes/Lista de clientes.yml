info:
  name: Lista de clientes
  type: http
  seq: 6

http:
  method: GET
  url: "{{SERVER}}/Client"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Listado de los primeros 100 clientes
