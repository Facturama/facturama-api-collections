info:
  name: Cargar Certificado
  type: http
  seq: 3

http:
  method: GET
  url: "{{SERVER}}/Dashboard/Home/UploadCertificates"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
