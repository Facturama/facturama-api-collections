info:
  name: Datos de Facturacion de mi cuenta
  type: http
  seq: 6

http:
  method: GET
  url: "{{SERVER}}/taxentity/billing-data"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
