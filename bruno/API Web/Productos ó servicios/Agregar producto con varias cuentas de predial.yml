info:
  name: Agregar producto con varias cuentas de predial
  type: http
  seq: 7

http:
  method: POST
  url: "{{SERVER}}/Product"
  headers:
    - name: Content-Type
      value: application/json
    - name: User-Agent
      value: "{{UserName}}"
  body:
    type: json
    data: "{\r

      \    \"Unit\": \"Servicio\",\r

      \    \"UnitCode\": \"E48\",\r

      \    \"IdentificationNumber\": \"WEB003\",\r

      \    \"Name\": \"Sitio Web CMS\",\r

      \    \"Description\": \"Renta casa habitación con varias cuentas predial\",\r

      \    \"Price\": 5500.9999,\r

      \    \"CodeProdServ\": \"43232408\",\r

      \    \"CuentasPredial\": \r

      \    [   \r

      \        \"987654321123456789\",\r

      \        \"546789512364789659\"\r

      \    ],\r

      \    \"ObjetoImp\": \"02\",\r

      \    \"Taxes\": [\r

      \        {\r

      \            \"Name\": \"IVA\",\r

      \            \"Rate\": 0.16,\r

      \            \"IsRetention\": false,\r

      \            \"IsFederalTax\": true\r

      \        }\r

      \        \r

      \    ]\r

      }"
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Permite agregar un elemento al catálogo de productos
