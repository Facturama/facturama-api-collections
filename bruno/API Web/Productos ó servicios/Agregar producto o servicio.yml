info:
  name: Agregar producto o servicio
  type: http
  seq: 1

http:
  method: POST
  url: "{{SERVER}}/Product"
  headers:
    - name: Content-Type
      value: application/json
    - name: User-Agent
      value: "{{UserName}}"
  body:
    type: json
    data: "{\r

      \    \"Unit\": \"Servicio\",\r

      \    \"UnitCode\": \"E48\",\r

      \    \"IdentificationNumber\": \"WEB003\",\r

      \    \"Name\": \"Sitio Web CMS\",\r

      \    \"Description\": \"Producto de prueba Marca ACME\",\r

      \    \"Price\": 999.9999,\r

      \    \"CodeProdServ\": \"43232408\",\r

      \    \"ObjetoImp\": \"02\",\r

      \    \"Taxes\": [\r

      \        {\r

      \            \"Name\": \"IVA\",\r

      \            \"Rate\": 0.16,\r

      \            \"IsRetention\": false,\r

      \            \"IsFederalTax\": true\r

      \        },\r

      \        {\r

      \            \"Name\": \"ISR\",\r

      \            \"IsRetention\": true,\r

      \            \"IsFederalTax\": true,\r

      \            \"Total\": 0.10\r

      \        },\r

      \        {\r

      \            \"Name\": \"IVA\",\r

      \            \"IsRetention\": true,\r

      \            \"IsFederalTax\": true,\r

      \            \"Total\": 0.106667\r

      \        }\r

      \    ]\r

      }"
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Permite agregar un elemento al catálogo de productos
