info:
  name: Lista de productos paginado
  type: http
  seq: 11

http:
  method: GET
  url: "{{SERVER}}/Products?start=0&length=10&search="
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  params:
    - name: start
      value: "0"
      type: query
    - name: length
      value: "10"
      type: query
    - name: search
      value: ""
      type: query
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Obtiene una lista de productos
