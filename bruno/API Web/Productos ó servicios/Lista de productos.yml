info:
  name: Lista de productos
  type: http
  seq: 10

http:
  method: GET
  url: "{{SERVER}}/Product"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Obtiene una lista de productos
