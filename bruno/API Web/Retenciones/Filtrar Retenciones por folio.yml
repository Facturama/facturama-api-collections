info:
  name: Filtrar Retenciones por folio
  type: http
  seq: 5

http:
  method: GET
  url: "{{SERVER}}/Retenciones?keyword=0004&status=all"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  params:
    - name: keyword
      value: "0004"
      type: query
    - name: status
      value: all
      type: query
  body:
    type: json
    data: ""
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
