info:
  name: Obtener los CSD cargados
  type: http
  seq: 3

http:
  method: GET
  url: "{{SERVER}}/api-lite/csds"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Obtiene todos los certificados relacionados con el usuario logueado
