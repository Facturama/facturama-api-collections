info:
  name: Descargar Cfdi
  type: http
  seq: 1

http:
  method: GET
  url: "{{SERVER}}/api/Cfdi/pdf/issuedLite/uju5OOIWMzm6G9tDPX9lXA2"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Descarga una Cfdi, permitiendo elegir entre diferentes formatos
