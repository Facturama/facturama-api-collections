info:
  name: Obtener Cfdis filtrados
  type: http
  seq: 4

http:
  method: GET
  url: "{{SERVER}}/api-lite/cfdis?keyword=radial"
  headers:
    - name: User-Agent
      value: "{{UserName}}"
  params:
    - name: keyword
      value: radial
      type: query
  auth:
    type: basic
    username: "{{UserName}}"
    password: "{{Password}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: Obtiene los últimos Cfdis que corresponden a los filtros aplicables
